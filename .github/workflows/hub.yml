name: hub
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/hub.js check   # fails if packaging is out of date with hub.json
      - run: node scripts/hub.js catalog && git diff --exit-code plugins/light-core/skills/find-workflow/references/catalog.md
      - run: npm test
